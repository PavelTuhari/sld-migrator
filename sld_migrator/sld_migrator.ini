; SLD Migrator — настройки. ПАРОЛЕЙ ЗДЕСЬ НЕТ: пароль вводится при подключении.
[general]
; путь к Oracle sqlplus (или просто sqlplus, если он в PATH)
sqlplus = C:\oracle\product\12c\client_1\bin\sqlplus.exe
nls_lang = AMERICAN_AMERICA.CL8MSWIN1251
encoding = cp1251
scripts_dir = ..\scripts
backup_prod_dir = ..\backup_prod
; интервал опроса базы монитором, секунд
monitor_interval = 10
; порт встроенного веб-сервера (0 = свободный)
http_port = 0

[profile:TEST]
kind = test
user = market
dsn = //test-db.example.local:1521/SERVICE
expected_host = test-db-host
; необязательно: как показывать сервер в окне вместо настоящего имени
; alias = test-db
; сверка сальдо (шаг W14): декабрь 2026, одна аналитика — до 1 минуты
check_date = 2026-12-31
check_cont = 2171
check_sc = 2905
; на тесте сальдо уже пересчитано, место под пересчёт не требуется
need_tables_mb = 0
need_ind_mb = 0
need_undo_mb = 0
jqp_default = 1

[profile:PROD]
kind = prod
user = market
dsn = //prod-db.example.local:1521/SERVICE
expected_host = prod-db-host
; пустая дата = конец прошлого месяца
check_date =
check_cont = 2171
check_sc = 2905,2609,105520,9805
need_tables_mb = 12500
need_ind_mb = 10000
need_undo_mb = 8000
jqp_default = 1000
